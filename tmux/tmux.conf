unbind r
bind r source-file ~/.config/tmux/tmux.conf

# enable colorscheme
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# force tmux to use default terminal settings.
set-option -g pane-border-style bg=default
set-option -g pane-active-border-style bg=default
set-option -g window-style bg=default
set-option -g window-active-style bg=default

set -g mouse on
set -g wrap on
set -g @kanagawa-theme 'wave'

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix


bind -n M-H previous-window
bind -n M-L next-window

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'Nybkox/tmux-kanagawa'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-battery'

# Custom configs
set -g @kanagawa-plugins "cpu-usage network"
set -g @kanagawa-network-colors "orange dark_gray"
set -g @kanagawa-cpu-usage-colors "white dark_gray"
# set -g @kanagawa-cpu-usage-colors "white dark_gray"
set -g @kanagawa-refresh-rate 5
set -g @kanagawa-show-powerline true
# set -g @kanagawa-show-empty-plugins false
set -g @kanagawa-show-left-icon 
set -g @kanagawa-show-flags true

set -g @kanagawa-cpu-usage-label 

set -g @kanagawa-show-left-sep  
# Symbols:        󰖩

set -g @kanagawa-git-show-current-symbol ✓

# set vi-mode
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

run '~/.tmux/plugins/tpm/tpm'
